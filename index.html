<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="hero">
        <div class = "brand">TaskFlow</div>
        <h1>আজকের কাজ, শেষ করবোই</h1>
        <p>Delegation দিয়ে বানানো - Infinnite items add করলেও porformant|</p>

    </header>
    <main class="app">
        <form id="f" class="composer">
            <input id="i" placeholder="নতুন কাজ লিখুন..." required />
            <button>+Add</button>
        </form>
        <ul id="list" class="list"></ul>
        <div class="stats"><span id="count">0 tasks</span> . <button id ="clear">Clear</button></div>
    </main>
    <footer>© TaskFlow 2026 . Tip: item click করলে done toggle|</footer>
    <script src="app.js"></script>

</body>
</html>
